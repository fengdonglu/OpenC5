                    dominantBaseline = 'central'
                } = options;

                const textGroup = SVGShapes.createGroup();
                const actualLineHeight = fontSize * lineHeight;
                const totalHeight = (lines.length - 1) * actualLineHeight;
                const startY = y - totalHeight / 2;

                lines.forEach((line, index) => {
                    if (line.trim()) {
                        const yPos = startY + index * actualLineHeight;
                        const textElement = this.createSingleLineText(x, yPos, line.trim(), {
                            fill,
                            'font-size': fontSize,
                            'font-weight': fontWeight,
                            'font-family': fontFamily,
                            'text-anchor': textAnchor,
                            'dominant-baseline': dominantBaseline
                        });
                        textGroup.appendChild(textElement);
                    }
                });

                return textGroup;
            },

            /**
             * Create segment text element / 创建扇形标签文本
             * @param {number} centerX - Center X coordinate / 中心X坐标
             * @param {number} centerY - Center Y coordinate / 中心Y坐标
             * @param {number} radius - Text radius / 文本半径
             * @param {number} angle - Text angle in degrees / 文本角度（度）
             * @param {string} text - Text content / 文本内容
             * @param {number} rotation - Rotation angle in degrees / 旋转角度（度）
             * @param {Object} options - Text options (e.g. fontSize) / 文本选项（如fontSize）
             * @returns {SVGElement} Text element or group / 文本元素或组
             */
            createSegmentText(centerX, centerY, radius, angle, text, rotation = 0, options = {}) {
                const point = SVGUtils.getPointOnCircleWithRotation(centerX, centerY, radius, angle, rotation);
                
                // Check if text contains line breaks / 检查文本是否包含换行符
                if (text.includes('\n')) {
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    return this.createMultiLineText(point.x, point.y, lines, options);
                }
                
                // Forward fontSize so it overrides the default in createSingleLineText / 传递fontSize以覆盖createSingleLineText中的默认值
                return this.createSingleLineText(point.x, point.y, text, options.fontSize ? { 'font-size': options.fontSize } : {});
            }
        };

        // =================================================================
        // 🎯 RING RENDERER MODULE / 圈层渲染模块
        // =================================================================
        const RingRenderer = {
            /**
             * Render single solid ring / 渲染单个纯色圈层
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {Object} config - Global configuration / 全局配置
             * @returns {SVGElement[]} Array of created elements / 创建的元素数组
             */
            renderSolidRing(svg, ring, config) {
                const elements = [];

                if (ring.innerRadius > 0) {
                    // Draw a true annulus so the inner radius punches a real hole / 绘制真实圆环，使内半径处形成真正的孔洞
                    const ringPath = SVGShapes.createPath(
                        SVGShapes.createRingPath(config.centerX, config.centerY, ring.innerRadius, ring.outerRadius),
                        {
                            fill: ring.color,
                            'fill-rule': 'evenodd'
                        }
                    );
                    svg.appendChild(ringPath);
                    elements.push(ringPath);
                } else {
                    // No inner radius: a plain filled disc is already correct / 无内半径：直接绘制实心圆盘
                    const outerCircle = SVGShapes.createCircle(config.centerX, config.centerY, ring.outerRadius, {
                        fill: ring.color
                    });
                    svg.appendChild(outerCircle);
                    elements.push(outerCircle);
                }

                return elements;
            },

            /**
             * Render segmented ring / 渲染分段圈层
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {Object} config - Global configuration / 全局配置
             * @param {Array} segmentColors - Segment colors / 分段颜色
             * @param {number} segmentCount - Number of segments / 分段数量
             * @param {number} angleStep - Angle per segment / 每段角度
             * @param {number} rotation - Rotation angle / 旋转角度
             * @param {number} ringIndex - Ring index / 圈层索引
             * @returns {SVGElement} Segment group element / 分段组元素
             */
            renderSegmentedRing(svg, ring, config, segmentColors, segmentCount, angleStep, rotation, ringIndex) {
                const segmentGroup = SVGShapes.createGroup({ id: `segmentRing${ringIndex}` });

                // A single segment spans the whole circle; a normal arc would start and end on
                // the same point and render nothing, so draw a full ring instead / 单段占满整圈；
                // 普通弧线首尾重合不会渲染，因此改为绘制完整圆环
                if (segmentCount === 1 || angleStep >= 360) {
                    const ringPath = SVGShapes.createPath(
                        SVGShapes.createRingPath(config.centerX, config.centerY, ring.innerRadius, ring.outerRadius),
                        {
                            fill: segmentColors[0],
                            'fill-rule': 'evenodd'
                        }
                    );
                    segmentGroup.appendChild(ringPath);
                    svg.appendChild(segmentGroup);
                    return segmentGroup;
                }

                for (let j = 0; j < segmentCount; j++) {
                    const startAngle = j * angleStep;
                    const endAngle = (j + 1) * angleStep;

                    const pathData = SVGShapes.createSegmentPath(
                        config.centerX, config.centerY, 
                        ring.innerRadius, ring.outerRadius, 
                        startAngle, endAngle, rotation
                    );

                    const path = SVGShapes.createPath(pathData, {
                        fill: segmentColors[j % segmentColors.length]
                    });

                    segmentGroup.appendChild(path);
                }

                svg.appendChild(segmentGroup);
                return segmentGroup;
            },

            /**
             * Render ring labels / 渲染圈层标签
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {Object} config - Global configuration / 全局配置
             * @param {Array} labels - Label array / 标签数组
             * @param {number} segmentCount - Number of segments / 分段数量
             * @param {number} angleStep - Angle per segment / 每段角度
             * @param {number} rotation - Rotation angle / 旋转角度
             * @param {number} ringIndex - Ring index / 圈层索引
             * @returns {SVGElement} Label group element / 标签组元素
             */
            renderRingLabels(svg, ring, config, labels, segmentCount, angleStep, rotation, ringIndex) {
                const labelGroup = SVGShapes.createGroup({ id: `labelRing${ringIndex}` });

                for (let j = 0; j < segmentCount && j < labels.length; j++) {
                    if (labels[j]) {
                        const midAngle = j * angleStep + angleStep / 2;
                        const textRadius = (ring.innerRadius + ring.outerRadius) / 2;
                        // Adapt the label font size to the available arc and ring thickness so narrow rings stay readable / 依据可用弧长与圈层厚度自适应字号，使窄圈层仍可读
                        const lines = String(labels[j]).split('\n');
                        const arcLength = textRadius * angleStep * Math.PI / 180; // angleStep is in degrees / angleStep为角度值
                        const ringThickness = ring.outerRadius - ring.innerRadius;
                        let fontSize = SVGUtils.calculateOptimalFontSize(lines, arcLength, ringThickness, 14, 6);
                        // calculateOptimalFontSize floors at 1, so clamp to a readable range here / 该函数下限为1，这里再钳制到可读范围
                        fontSize = Math.max(6, Math.min(14, fontSize));
                        const textElement = SVGText.createSegmentText(
                            config.centerX, config.centerY, 
                            textRadius, midAngle, labels[j], rotation, { fontSize }
                        );
                        
                        // Handle single line text (set textContent) or multi-line text (already handled in createSegmentText) 
                        // 处理单行文本（设置textContent）或多行文本（已在createSegmentText中处理）
                        if (!labels[j].includes('\n')) {
                            textElement.textContent = labels[j];
                        }
                        
                        labelGroup.appendChild(textElement);
                    }
                }

                svg.appendChild(labelGroup);
                return labelGroup;
            },

            /**
             * Render radial separator lines / 渲染径向分隔线
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {Object} config - Global configuration / 全局配置
             * @param {number} segmentCount - Number of segments / 分段数量
             * @param {number} angleStep - Angle per segment / 每段角度
             * @param {number} rotation - Rotation angle / 旋转角度
             * @param {number} ringIndex - Ring index / 圈层索引
             * @returns {SVGElement} Radial lines group element / 径向线组元素
             */
            renderRadialLines(svg, ring, config, segmentCount, angleStep, rotation, ringIndex) {
                const radialLinesGroup = SVGShapes.createGroup({
                    id: `radialLines${ringIndex}`,
                    stroke: 'white',
                    'stroke-width': '1.5',
                    'stroke-opacity': '0.7'
                });

                // Generate radial separator lines, located at the boundary of each sector / 生成径向分隔线，位于每个扇区的边界上
                for (let j = 0; j < segmentCount; j++) {
                    // Separator line is at the start angle of the sector (boundary between sectors) / 分隔线位于扇区的起始角度（扇区之间的边界）
                    const angle = j * angleStep;

                    const outerPoint = SVGUtils.getPointOnCircleWithRotation(
                        config.centerX, config.centerY, ring.outerRadius, angle, rotation
                    );
                    const innerPoint = SVGUtils.getPointOnCircleWithRotation(
                        config.centerX, config.centerY, ring.innerRadius, angle, rotation
                    );

                    const line = SVGShapes.createLine(
                        outerPoint.x, outerPoint.y, 
                        innerPoint.x, innerPoint.y
                    );

                    radialLinesGroup.appendChild(line);
                }

                svg.appendChild(radialLinesGroup);
                return radialLinesGroup;
            },

            /**
             * Render ring borders / 渲染圈层边界
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {Array} rings - All rings configuration / 所有圈层配置
             * @param {Object} config - Global configuration / 全局配置
             */
            renderRingBorders(svg, rings, config) {
                rings.forEach(ring => {
                    if (ring.outerRadius > 0) {
                        const border = SVGShapes.createCircle(config.centerX, config.centerY, ring.outerRadius, {
                            fill: 'none',
                            stroke: 'white',
                            'stroke-width': '2'
                        });
                        svg.appendChild(border);
                    }
                });
            },

            /**
             * Build the effective segment configuration for a ring / 构建圈层的有效分段配置
             * Shared by renderRing and refreshRingLabels so both derive labels identically / 供renderRing与refreshRingLabels共用，确保标签派生一致
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {string} currentLanguage - Current language / 当前语言
             * @returns {Object} Segment config { colors, labels, count, defaultRotation } / 分段配置
             */
            getRingSegmentConfig(ring, currentLanguage) {
                // Get segment configuration (used to determine segment count, labels and colors) / 获取分段配置（用于确定分段数、标签和颜色）
                const segmentConfig = {};

                // Build segment config from SegmentData module / 从SegmentData模块构建分段配置
                SegmentData.getAvailableTypes().forEach(type => {
                    const data = SegmentData.getData(type, currentLanguage);
                    segmentConfig[type] = {
                        colors: data.colors,
                        labels: Array.isArray(ring.segmentLabels) ? ring.segmentLabels : data.labels,
                        count: data.count,
                        defaultRotation: data.defaultRotation
                    };
                });

                // Special handling for manual type / 手动类型的特殊处理
                segmentConfig['manual'] = {
                    colors: SegmentData.manual.colors,
                    labels: Array.isArray(ring.segmentLabels) ? ring.segmentLabels : SegmentData.manual.labels,
                    count: (Array.isArray(ring.segmentLabels) && ring.segmentLabels.length) || SegmentData.manual.count,
                    defaultRotation: 0
                };

                return segmentConfig[ring.segmentType] || segmentConfig['manual'];
            },

            /**
             * Refresh a ring's labels in place without rebuilding the whole SVG / 在不重建整个SVG的情况下刷新圈层标签
             * Keeps labels upright while following the current rotation / 保持标签正立并跟随当前rotation
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {number} ringIndex - Ring index / 圈层索引
             * @param {Object} config - Global configuration / 全局配置
             * @param {string} currentLanguage - Current language / 当前语言
             */
            refreshRingLabels(svg, ring, ringIndex, config, currentLanguage) {
                // Remove the existing label group so it can be re-positioned / 移除已有标签组以便重新定位
                const existing = svg.querySelector(`#labelRing${ringIndex}`);
                if (existing) existing.remove();

                // Re-derive labels exactly like renderRing / 与renderRing完全一致地重新派生标签
                const { labels, count: segmentCount, defaultRotation } =
                    this.getRingSegmentConfig(ring, currentLanguage);
                const angleStep = 360 / segmentCount;
                const rotation = ring.rotation || defaultRotation || 0;

                // Re-place labels at the current rotation while keeping the glyphs upright / 以当前rotation重新定位标签，同时保持字形正立
                if (ring.segmentType && ring.segmentType !== 'none' && labels) {
                    this.renderRingLabels(svg, ring, config, labels, segmentCount, angleStep, rotation, ringIndex);
                }
            },

            /**
             * Render complete ring / 渲染完整圈层
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {number} ringIndex - Ring index / 圈层索引
             * @param {Object} config - Global configuration / 全局配置
             * @param {string} currentLanguage - Current language / 当前语言
             */
            renderRing(svg, ring, ringIndex, config, currentLanguage) {
                // Get segment configuration (used to determine segment count, labels and colors) / 获取分段配置（用于确定分段数、标签和颜色）
                const { colors: segmentColors, labels, count: segmentCount, defaultRotation } =
                    this.getRingSegmentConfig(ring, currentLanguage);
                const angleStep = 360 / segmentCount;
                const rotation = ring.rotation || defaultRotation || 0;
                // Remember the effective angle baked into the geometry for cheap slider previews / 记录已烘焙进几何的有效角度，供滑块廉价预览使用
                renderedRotations[ringIndex] = rotation;

                // Determine how to render ring based on color type / 根据颜色类型决定如何渲染圆环
                if (ring.type === 'solid') {
                    this.renderSolidRing(svg, ring, config);
                } else if (ring.type === 'segments') {
                    this.renderSegmentedRing(svg, ring, config, segmentColors, segmentCount, angleStep, rotation, ringIndex);
                }

                // Add segment labels (independent of color type, display as long as there is segment type) / 添加分段标签（与颜色类型无关，只要有分段类型就显示）
                if (ring.segmentType && ring.segmentType !== 'none' && labels) {
                    this.renderRingLabels(svg, ring, config, labels, segmentCount, angleStep, rotation, ringIndex);
                }

                // Add independent radial separator lines for each ring (between sectors, following rotation angle) / 为每个圈层添加独立的径向分隔线（位于扇区之间，跟随旋转角度）
                if (ring.segmentType && ring.segmentType !== 'none' && segmentCount > 1) {
                    this.renderRadialLines(svg, ring, config, segmentCount, angleStep, rotation, ringIndex);
                }
            }
        };

        // =================================================================
        // 📊 LEGEND MODULE / 图例模块
        // =================================================================
        const Legend = {
            /**
             * Resolve a ring's display content: manual labels or the i18n name / 解析圈层显示内容：手动标签或i18n名称
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {number} index - Ring index / 圈层索引
             * @param {string} currentLanguage - Current language / 当前语言
             * @returns {string} Display content / 显示内容
             */
            getRingDisplayContent(ring, index, currentLanguage) {
                // manual with labels / 手动类型且有标签
                if (ring.segmentType === 'manual' && Array.isArray(ring.segmentLabels) && ring.segmentLabels.length > 0) {
                    return ring.segmentLabels.join(',');
                }
                return I18nData.getSegmentTypeName(ring.segmentType, currentLanguage) || ring.content || `Ring ${index + 1}`;
            },

            /**
             * Calculate legend content dimensions / 计算图例内容尺寸
             * @param {Array} rings - Ring configurations / 圈层配置数组
             * @param {string} currentLanguage - Current language / 当前语言
             * @returns {Object} Legend dimensions / 图例尺寸
             */
            calculateLegendDimensions(rings, currentLanguage) {
                let maxContentWidth = 0;
                
                rings.forEach((ring, index) => {
                    const displayContent = this.getRingDisplayContent(ring, index, currentLanguage);

                    // Estimate width using character count (average 7px per character) / 使用字符数估算宽度（平均每个字符约7px）
                    const estimatedWidth = displayContent.length * 7;
                    maxContentWidth = Math.max(maxContentWidth, estimatedWidth);
                });

                const numberWidth = 25;
                const contentWidth = Math.max(maxContentWidth, 25);
                
                return {
                    numberWidth,
                    contentWidth,
                    totalWidth: numberWidth + contentWidth + 5,
                    maxContentWidth
                };
            },

            /**
             * Calculate legend position / 计算图例位置
             * @param {Object} config - Global configuration / 全局配置
             * @param {number} maxRadius - Maximum ring radius / 最大圈层半径
             * @returns {Object} Legend position / 图例位置
             */
            calculateLegendPosition(config, maxRadius) {
                let legendX, legendY;
                
                if (config.legendPosition === 'bottomRight') {
                    // Bottom right position / 右下角位置
                    legendX = config.centerX + maxRadius + 30;
                    legendY = config.centerY + maxRadius - (config.rings.length * 20) - 20;
                } else {
                    // Default right side position / 默认右侧位置
                    legendX = config.centerX + maxRadius + 30;
                    legendY = config.centerY - (config.rings.length * 20) / 2;
                }

                return { legendX, legendY };
            },

            /**
             * Create legend headers / 创建图例标题
             * @param {SVGElement} legendGroup - Legend group element / 图例组元素
             * @param {number} legendX - Legend X position / 图例X位置
             * @param {number} legendY - Legend Y position / 图例Y位置
             * @param {number} numberWidth - Number column width / 编号列宽度
             * @param {number} contentWidth - Content column width / 内容列宽度
             * @param {Function} getText - Text getter function / 文本获取函数
             */
            createLegendHeaders(legendGroup, legendX, legendY, numberWidth, contentWidth, getText) {
                // Add legend column title backgrounds / 添加图例列标题背景
                const ringTitleBg = SVGShapes.createPath('', {
                    d: `M ${legendX - 5} ${legendY - 28} h ${numberWidth} v 22 h -${numberWidth} Z`,
                    fill: '#f8f9fa',
                    stroke: '#e0e0e0',
                    'stroke-width': '0.5',
                    rx: '3'
                });
                legendGroup.appendChild(ringTitleBg);
                
                const contentTitleBg = SVGShapes.createPath('', {
                    d: `M ${legendX + numberWidth - 5} ${legendY - 28} h ${contentWidth} v 22 h -${contentWidth} Z`,
                    fill: '#f8f9fa',
                    stroke: '#e0e0e0',
                    'stroke-width': '0.5',
                    rx: '3'
                });
                legendGroup.appendChild(contentTitleBg);
                
                // Add legend column titles / 添加图例列标题
                const ringTitleText = SVGText.createSingleLineText(
                    legendX + numberWidth / 2 - 5, legendY - 17, getText('legendRing'), {
                        fill: '#333',
                        'font-size': '9',
                        'font-weight': 'bold'
                    }
                );
                legendGroup.appendChild(ringTitleText);
                
                const contentTitleText = SVGText.createSingleLineText(
                    legendX + numberWidth + contentWidth / 2 - 5, legendY - 17, getText('legendContent'), {
                        fill: '#333',
                        'font-size': '9',
                        'font-weight': 'bold'
                    }
                );
                legendGroup.appendChild(contentTitleText);
            },

            /**
             * Create single legend item / 创建单个图例条目
             * @param {SVGElement} legendGroup - Legend group element / 图例组元素
             * @param {Object} ring - Ring configuration / 圈层配置
             * @param {number} index - Ring index / 圈层索引
             * @param {number} legendX - Legend X position / 图例X位置
             * @param {number} itemY - Item Y position / 条目Y位置
             * @param {number} numberWidth - Number column width / 编号列宽度
             * @param {number} contentWidth - Content column width / 内容列宽度
             * @param {string} currentLanguage - Current language / 当前语言
             */
            createLegendItem(legendGroup, ring, index, legendX, itemY, numberWidth, contentWidth, currentLanguage) {
                // Row group so hover can highlight the whole row / 行分组，悬停时可整行高亮
                const itemGroup = SVGShapes.createGroup({
                    id: `legendItem${index}`,
                    'data-legend-index': String(index)
                });

                // Color the entire row (number + content) with the ring color(s) / 用圈层颜色为整行（编号+内容）着色
                const rowStartX = legendX - 5;
                const rowWidth = numberWidth + contentWidth;

                if (ring.type === 'solid' && typeof ring.color === 'string') {
                    // Single solid color fills the whole row / 单色实心填满整行
                    const rowBg = SVGShapes.createPath('', {
                        d: `M ${rowStartX} ${itemY - 9} h ${rowWidth} v 18 h -${rowWidth} Z`,
                        fill: ring.color,
                        stroke: '#e0e0e0',
                        'stroke-width': '0.5'
                    });
                    itemGroup.appendChild(rowBg);
                } else {
                    // Multi-color: split the row into one block per segment / 多色：按分段数把整行切成色块
                    const { colors, count } = RingRenderer.getRingSegmentConfig(ring, currentLanguage);
                    const n = Math.max(1, count || 1);
                    const blockWidth = rowWidth / n;
                    for (let i = 0; i < n; i++) {
                        const blockX = rowStartX + i * blockWidth;
                        // Last block absorbs rounding so widths sum exactly to rowWidth / 最后一块吸收舍入误差，确保总宽精确
                        const width = i === n - 1 ? rowStartX + rowWidth - blockX : blockWidth;
                        const block = SVGShapes.createPath('', {
                            d: `M ${blockX} ${itemY - 9} h ${width} v 18 h -${width} Z`,
                            fill: (colors && colors[i % colors.length]) || '#999',
                            stroke: 'none',
                            'stroke-width': '0'
                        });
                        itemGroup.appendChild(block);
                    }
                }

                // Light outline so the row still reads as a cell / 浅色描边使行仍呈现为单元格
                const rowOutline = SVGShapes.createPath('', {
                    d: `M ${rowStartX} ${itemY - 9} h ${rowWidth} v 18 h -${rowWidth} Z`,
                    fill: 'none',
                    stroke: '#e0e0e0',
                    'stroke-width': '0.5'
                });
                itemGroup.appendChild(rowOutline);
                
                // Ring number (white with subtle outline for legibility) / 圈层编号（白色加描边保证可读）
                const numberText = SVGText.createSingleLineText(
                    legendX + numberWidth / 2 - 5, itemY, String(index + 1), {
                        fill: 'white',
                        'paint-order': 'stroke',
                        stroke: 'rgba(0,0,0,.35)',
                        'stroke-width': '0.6',
                        'font-size': '10',
                        'font-weight': 'bold'
                    }
                );
                itemGroup.appendChild(numberText);

                // Content text (white with subtle outline for legibility) / 内容文字（白色加描边保证可读）
                const displayContent = this.getRingDisplayContent(ring, index, currentLanguage);
                const contentText = SVGText.createSingleLineText(
                    legendX + numberWidth - 2, itemY, displayContent, {
                        'text-anchor': 'start',
                        fill: 'white',
                        'paint-order': 'stroke',
                        stroke: 'rgba(0,0,0,.35)',
                        'stroke-width': '0.6',
                        'font-size': '9'
                    }
                );
                itemGroup.appendChild(contentText);

                legendGroup.appendChild(itemGroup);
            },

            /**
             * Create all legend items / 创建所有图例条目
             * @param {SVGElement} legendGroup - Legend group element / 图例组元素
             * @param {Array} rings - Ring configurations / 圈层配置数组
             * @param {number} legendX - Legend X position / 图例X位置
             * @param {number} legendY - Legend Y position / 图例Y位置
             * @param {number} numberWidth - Number column width / 编号列宽度
             * @param {number} contentWidth - Content column width / 内容列宽度
             * @param {string} currentLanguage - Current language / 当前语言
             */
            createAllLegendItems(legendGroup, rings, legendX, legendY, numberWidth, contentWidth, currentLanguage) {
                rings.forEach((ring, index) => {
                    const itemY = legendY + index * 20;
                    this.createLegendItem(legendGroup, ring, index, legendX, itemY, numberWidth, contentWidth, currentLanguage);
                });
            },

            /**
             * Add complete legend to SVG / 在SVG中添加完整图例
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {Object} config - Global configuration / 全局配置
             * @param {string} currentLanguage - Current language / 当前语言
             */
            addLegendToSVG(svg, config, currentLanguage) {
                if (config.rings.length === 0 || !config.showLegend) {
                    legendRowGeometry = null;
                    return;
                }

                const getText = (key) => I18nData.getText(key, currentLanguage);
                const maxRadius = config.rings.length > 0 ? Math.max(...config.rings.map(r => r.outerRadius)) : config.centerRadius;
                
                // Calculate legend dimensions / 计算图例尺寸
                const dimensions = this.calculateLegendDimensions(config.rings, currentLanguage);
                const { numberWidth, contentWidth } = dimensions;
                
                // Calculate legend position / 计算图例位置
                const { legendX, legendY } = this.calculateLegendPosition(config, maxRadius);
                
                // Create legend group / 创建图例组
                const legendGroup = SVGShapes.createGroup({ id: 'legendGroup' });
                
                // Create legend headers / 创建图例标题
                this.createLegendHeaders(legendGroup, legendX, legendY, numberWidth, contentWidth, getText);
                
                // Create all legend items / 创建所有图例条目
                this.createAllLegendItems(legendGroup, config.rings, legendX, legendY, numberWidth, contentWidth, currentLanguage);

                // Reusable row highlight drawn on top of the items / 可复用的行高亮，绘制在条目之上
                const legendHighlight = SVGUtils.createSVGElement('rect', {
                    id: 'legendHighlight',
                    x: 0,
                    y: 0,
                    width: 0,
                    height: 0,
                    rx: '3',
                    fill: 'none',
                    stroke: 'var(--accent-color)',
                    'stroke-width': '2',
                    'pointer-events': 'none',
                    style: 'display:none;'
                });
                legendGroup.appendChild(legendHighlight);

                // Remember row geometry so hover can position the highlight / 记录行几何以便悬停定位高亮
                legendRowGeometry = {
                    legendX,
                    legendY,
                    numberWidth,
                    contentWidth,
                    itemHeight: 20,
                    startX: legendX - 5,
                    totalWidth: numberWidth + contentWidth
                };

                svg.appendChild(legendGroup);
            },

            /**
             * Calculate required legend width for SVG sizing / 计算SVG尺寸所需的图例宽度
             * @param {Object} config - Global configuration / 全局配置
             * @param {string} currentLanguage - Current language / 当前语言
             * @returns {number} Required legend width / 所需图例宽度
             */
            calculateRequiredWidth(config, currentLanguage) {
                if (!config.showLegend) return 20;
                
                const dimensions = this.calculateLegendDimensions(config.rings, currentLanguage);
                return Math.max(dimensions.maxContentWidth + 35, 70);
            }
        };

        // =================================================================
        // 📄 CENTER TEXT MODULE / 中心文字模块
        // =================================================================
        const CenterText = {
            /**
             * Add center text with multi-line support / 添加中心文字支持多行显示
             * @param {SVGElement} svg - SVG container / SVG容器
             * @param {string} text - Text content / 文本内容
             * @param {Object} config - Global configuration / 全局配置
             */
            addCenterText(svg, text, config) {
                if (!text || text.trim() === '') return;

                // Split text by line breaks / 按换行符分割文本
                const lines = text.split('\n').filter(line => line.trim() !== '');
                if (lines.length === 0) return;

                // Calculate available space and font size / 计算可用空间和字体大小
                const availableHeight = config.centerRadius * 1.6;
                const availableWidth = config.centerRadius * 1.8;

                // Wrap overly long lines by character count so the text fits the center circle / 对过长行按字符换行，确保文字适配中心圆
                const maxChars = Math.max(1, Math.floor(availableWidth / 8));
                const wrappedLines = [];
                lines.forEach(line => {
                    if (line.length <= maxChars) {
                        wrappedLines.push(line);
                        return;
                    }
                    for (let i = 0; i < line.length; i += maxChars) {
                        wrappedLines.push(line.slice(i, i + maxChars));
                    }
                });

                // Calculate font size based on line count and available space / 根据行数和可用空间计算字体大小
                const fontSize = SVGUtils.calculateOptimalFontSize(wrappedLines, availableWidth, availableHeight, 24, 10);

                // Create multi-line text / 创建多行文本
                const centerTextGroup = SVGText.createMultiLineText(config.centerX, config.centerY, wrappedLines, {
                    fontSize,
                    fill: '#333',
                    fontWeight: 'bold',
                    fontFamily: 'Arial, sans-serif'
                });

                centerTextGroup.setAttribute('id', 'centerTextGroup');
                svg.appendChild(centerTextGroup);
            },

            /**
             * Calculate center text area dimensions / 计算中心文字区域尺寸
             * @param {Object} config - Global configuration / 全局配置
             * @returns {Object} Center text area dimensions / 中心文字区域尺寸
             */
            calculateTextArea(config) {
                return {
                    availableHeight: config.centerRadius * 1.6,
                    availableWidth: config.centerRadius * 1.8,
                    centerX: config.centerX,
                    centerY: config.centerY
                };
            },

            /**
             * Validate center text content / 验证中心文字内容
             * @param {string} text - Text content / 文本内容
             * @returns {Object} Validation result / 验证结果
             */
            validateTextContent(text) {
                if (!text || text.trim() === '') {
                    return { valid: false, reason: 'empty' };
                }

                const lines = text.split('\n').filter(line => line.trim() !== '');
                if (lines.length === 0) {
                    return { valid: false, reason: 'no_valid_lines' };
                }

                if (lines.length > 10) {
                    return { valid: false, reason: 'too_many_lines', maxLines: 10 };
                }

                return { valid: true, lines };
            }
        };

        // Effective rotation baked into each ring's geometry on the last full render / 上次整图渲染时烘焙进各圈层几何的有效角度
        let renderedRotations = [];

        // Generate the complete SVG / 生成完整的SVG
        function generateCircle() {
            const container = document.getElementById('svg-container');
            container.innerHTML = '';

            // Calculate the maximum radius based on rings / 根据圈层计算最大半径
            const maxRadius = config.rings.length > 0 ? Math.max(...config.rings.map(r => r.outerRadius)) : config.centerRadius;
            
            // Calculate required width for legend using Legend module / 使用Legend模块计算图例所需的宽度
            const legendWidth = Legend.calculateRequiredWidth(config, currentLanguage);
            const svgWidth = Math.max(800, (maxRadius + 50) * 2 + legendWidth);
            const svgHeight = Math.max(800, (maxRadius + 50) * 2); // Height maintains original calculation / 高度保持原有计算

            // Update config dimensions / 更新配置尺寸
            config.width = svgWidth;
            config.height = svgHeight;
            config.centerX = (svgWidth - legendWidth) / 2;
            config.centerY = svgHeight / 2;

            // Create main SVG element / 创建主SVG元素
            const svg = SVGUtils.createSVGElement('svg', {
                width: svgWidth,
                height: svgHeight,
                viewBox: `0 0 ${svgWidth} ${svgHeight}`,
                xmlns: 'http://www.w3.org/2000/svg'
            });

            // Reset the per-ring baked-rotation cache before rebuilding / 重建前重置每个圈层的已烘焙角度缓存
            renderedRotations = [];

            // Generate rings from outside to inside using the new RingRenderer module / 使用新的RingRenderer模块从外到内生成圆环
            for (let i = config.rings.length - 1; i >= 0; i--) {
                RingRenderer.renderRing(svg, config.rings[i], i, config, currentLanguage);
            }

            // Add ring borders using RingRenderer / 使用RingRenderer添加圈层边界
            RingRenderer.renderRingBorders(svg, config.rings, config);

            // Hover highlight overlay, rebuilt each redraw / 悬停高亮覆盖层，每次重绘重建
            ringHoverHighlight = SVGUtils.createSVGElement('g', {
                id: 'ringHoverHighlight',
                style: 'display: none;',
                'pointer-events': 'none'
            });
            const firstRingForHover = config.rings[0];
            const hoverRingPath = SVGUtils.createSVGElement('path', {
                d: firstRingForHover
                    ? SVGShapes.createRingPath(config.centerX, config.centerY, firstRingForHover.innerRadius, firstRingForHover.outerRadius)
                    : '',
                'fill-rule': 'evenodd',
                style: 'fill: var(--accent-color); fill-opacity: 0.35; stroke: var(--accent-color); stroke-width: 1.5; pointer-events: none;'
            });
            ringHoverHighlight.appendChild(hoverRingPath);
            svg.appendChild(ringHoverHighlight);
            // Reset hover state after rebuild / 重建后重置悬停状态
            lastHoverIndex = -1;
            if (!ringHoverTooltip) ringHoverTooltip = document.getElementById('ringHoverTooltip');
            if (ringHoverTooltip) {
                ringTooltipTitle = ringHoverTooltip.querySelector('#ringTooltipTitle');
                ringHoverTooltip.style.display = 'none';
                hoverTooltipVisible = false;
            }

            // Finally add center white area and text, ensuring they are on the top layer / 最后添加中心白色区域和文字，确保它们在最上层
            const centerCircle = SVGShapes.createCircle(config.centerX, config.centerY, config.centerRadius, {
                fill: 'white',
                stroke: 'rgba(0,0,0,0.1)',
                'stroke-width': '1'
            });
            svg.appendChild(centerCircle);

            // Add center text if name is provided using CenterText module / 如果有名称则使用CenterText模块添加中心文字
            const currentCenterName = config.centerNames[currentLanguage];
            if (currentCenterName && currentCenterName.trim()) {
                CenterText.addCenterText(svg, currentCenterName.trim(), config);
            }

            // Add legend to SVG using Legend module / 使用Legend模块在SVG中添加图例
            Legend.addLegendToSVG(svg, config, currentLanguage);

            // Add mouse interaction for rotation / 添加鼠标交互旋转功能
            addMouseRotationInteraction(svg);

            container.appendChild(svg);
        }

        // Debounced full regeneration reused by drag/slider inputs / 拖拽与滑块共用的防抖全量重绘
        let regenerateTimeout = null;
        function debouncedRegenerate() {
            if (regenerateTimeout) clearTimeout(regenerateTimeout);
            regenerateTimeout = setTimeout(() => generateCircle(), 16);
        }

        // Flush a pending debounced regeneration immediately / 立即执行待处理的防抖重绘
        function flushRegenerate() {
            if (regenerateTimeout) clearTimeout(regenerateTimeout);
            regenerateTimeout = null;
            generateCircle();
        }

        // Transient toast timer / 提示浮标定时器
        let appToastTimer = null;

        // Show a transient toast message / 显示一个短暂提示
        function showToast(msg) {
            const toast = document.getElementById('appToast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            if (appToastTimer) clearTimeout(appToastTimer);
            appToastTimer = setTimeout(() => {
                toast.classList.remove('show');
                appToastTimer = null;
            }, 2000);
        }

        // Global interaction state / 全局交互状态
        let globalInteractionState = {
            isDragging: false,
            dragRingIndex: -1,
            startAngle: 0,
            startRotation: 0
        };

        // Hover highlight overlay + drag tooltip state / 悬停高亮覆盖层与拖拽提示状态
        let ringHoverHighlight = null;   // <g id="ringHoverHighlight"> rebuilt with the SVG / 随SVG重建
        let lastHoverIndex = -1;         // Last highlighted ring index / 上次高亮的圈层索引
        let ringHoverTooltip = null;     // <div id="ringHoverTooltip"> / 悬停提示浮标
        let ringTooltipTitle = null;     // <div id="ringTooltipTitle"> inside the tooltip / 浮标内的标题行
        let hoverTooltipFrame = null;    // rAF throttle handle / rAF节流句柄
        let hoverTooltipX = 0;           // Pending tooltip position (client coords) / 待应用坐标
        let hoverTooltipY = 0;
        let hoverTooltipVisible = false;
        let legendRowGeometry = null;    // Legend row geometry for hover highlight / 悬停高亮用的图例行几何

        // Reset drag state when the window loses focus mid-drag / 窗口在拖拽中失焦时重置拖拽状态
        function resetDragState() {
            if (!globalInteractionState.isDragging && globalInteractionState.dragRingIndex < 0) return;
            globalInteractionState.isDragging = false;
            globalInteractionState.dragRingIndex = -1;
            const svgEl = document.querySelector('#svg-container svg');
            if (svgEl) svgEl.style.cursor = 'default';
            document.body.style.userSelect = '';
            // Flush so the rebuilt geometry matches the stored rotation / 刷新以使重建几何与已存角度一致
            flushRegenerate();
        }
        window.addEventListener('blur', resetDragState);

        // Add mouse rotation interaction to SVG / 为SVG添加鼠标旋转交互
        function addMouseRotationInteraction(svg) {
            const state = globalInteractionState;
            // Throttle handle for label re-positioning during drag / 拖拽期间标签重定位的节流句柄
            let labelRefreshFrame = null;

            // Add transparent background for mouse events / 添加透明背景捕获鼠标事件
            const existingBgRect = svg.querySelector('rect[data-interaction="background"]');
            if (existingBgRect) existingBgRect.remove();

            const bgRect = SVGUtils.createSVGElement('rect', {
                x: 0, y: 0, width: '100%', height: '100%',
                fill: 'transparent', 'pointer-events': 'all',
                'data-interaction': 'background'
            });
            svg.insertBefore(bgRect, svg.firstChild);

            // Get ring index from radius / 根据半径获取圈层索引
            function getRingIndexFromRadius(radius) {
                for (let i = 0; i < config.rings.length; i++) {
                    const ring = config.rings[i];
                    if (radius >= ring.innerRadius && radius <= ring.outerRadius) {
                        return i;
                    }
                }
                return -1;
            }

            // Calculate angle from center / 计算从中心点的角度
            function getAngleFromCenter(clientX, clientY) {
                const rect = svg.getBoundingClientRect();
                const scaleX = rect.width / config.width;
                const scaleY = rect.height / config.height;
                const svgCenterX = rect.left + (config.centerX * scaleX);
                const svgCenterY = rect.top + (config.centerY * scaleY);
                const deltaX = clientX - svgCenterX;
                const deltaY = clientY - svgCenterY;
                let angle = Math.atan2(deltaY, deltaX) * 180 / Math.PI;
                if (angle < 0) angle += 360;
                return angle;
            }

            // Calculate distance from center / 计算到中心点的距离
            function getDistanceFromCenter(clientX, clientY) {
                const rect = svg.getBoundingClientRect();
                const scaleX = rect.width / config.width;
                const scaleY = rect.height / config.height;
                const avgScale = (scaleX + scaleY) / 2;
                // Guard against a zero or non-finite scale (e.g. hidden SVG) to avoid dividing by zero / 防止缩放为0或非有限值（如隐藏的SVG），避免除零
                if (!avgScale || !Number.isFinite(avgScale)) return -1;
                const svgCenterX = rect.left + (config.centerX * scaleX);
                const svgCenterY = rect.top + (config.centerY * scaleY);
                const deltaX = clientX - svgCenterX;
                const deltaY = clientY - svgCenterY;
                const actualDistance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                return actualDistance / avgScale;
            }

            // Hide hover feedback / 隐藏悬停反馈
            function hideHoverFeedback() {
                lastHoverIndex = -1;
                if (hoverTooltipFrame) {
                    cancelAnimationFrame(hoverTooltipFrame);
                    hoverTooltipFrame = null;
                }
                if (ringHoverHighlight) ringHoverHighlight.style.display = 'none';
                const legendHighlight = document.getElementById('legendHighlight');
                if (legendHighlight) legendHighlight.style.display = 'none';
                if (ringHoverTooltip) {
                    ringHoverTooltip.style.display = 'none';
                    hoverTooltipVisible = false;
                }
            }

            // rAF-throttled tooltip positioning (transform only, no left/top layout thrash) / rAF节流定位浮标
            function scheduleTooltipPosition(clientX, clientY) {
                hoverTooltipX = clientX;
                hoverTooltipY = clientY;
                if (hoverTooltipFrame) return;
                hoverTooltipFrame = requestAnimationFrame(() => {
                    hoverTooltipFrame = null;
                    if (!ringHoverTooltip) return;
                    const panel = document.querySelector('.preview-panel');
                    if (!panel) return;
                    const rect = panel.getBoundingClientRect();
                    const x = hoverTooltipX - rect.left + 12;
                    const y = hoverTooltipY - rect.top + 12;
                    ringHoverTooltip.style.transform = `translate(${x}px, ${y}px)`;
                });
            }

            // Update highlight/tooltip; only rebuild highlight when the ring index changes / 仅在圈层索引变化时重建高亮
            function updateHoverFeedback(ringIndex, clientX, clientY) {
                if (!ringHoverTooltip) ringHoverTooltip = document.getElementById('ringHoverTooltip');

                if (ringIndex < 0) {
                    hideHoverFeedback();
                    return;
                }

                // Tooltip follows the pointer while hovering / 悬停时浮标跟随指针
                if (ringHoverTooltip) {
                    if (!hoverTooltipVisible) {
                        ringHoverTooltip.style.display = 'block';
                        hoverTooltipVisible = true;
                    }
                    scheduleTooltipPosition(clientX, clientY);
                }

                // Only touch the overlay geometry when the index actually changes / 仅索引变化时更新覆盖层
                if (ringIndex === lastHoverIndex) return;
                const ring = config.rings[ringIndex];
                if (!ring) return;

                // Update the tooltip title only when the hovered ring changes / 仅在悬停圈层变化时更新提示标题
                if (ringTooltipTitle) {
                    const content = Legend.getRingDisplayContent(ring, ringIndex, currentLanguage);
                    ringTooltipTitle.textContent = '#' + (ringIndex + 1) + ' · ' + content;
                }

                if (ringHoverHighlight) {
                    const path = ringHoverHighlight.querySelector('path');
                    if (path) {
                        path.setAttribute('d', SVGShapes.createRingPath(config.centerX, config.centerY, ring.innerRadius, ring.outerRadius));
                    }
                    ringHoverHighlight.style.display = 'block';
                }

                // Position/show the legend row highlight for the hovered ring / 定位并显示悬停圈层的图例行高亮
                if (config.showLegend) {
                    const legendHighlight = document.getElementById('legendHighlight');
                    if (legendHighlight && legendRowGeometry) {
                        const rowY = legendRowGeometry.legendY + ringIndex * legendRowGeometry.itemHeight - 9;
                        legendHighlight.setAttribute('x', legendRowGeometry.startX - 1);
                        legendHighlight.setAttribute('y', rowY - 1);
                        legendHighlight.setAttribute('width', legendRowGeometry.totalWidth + 2);
                        legendHighlight.setAttribute('height', 18 + 2);
                        legendHighlight.style.display = 'block';
                    }
                }
                lastHoverIndex = ringIndex;
            }

            // Update rotation inputs / 更新旋转输入
            function updateRotationInputs(ringIndex, angle) {
                const rotationInput = document.getElementById(`rotation-${ringIndex}`);
                const rotationSlider = document.getElementById(`slider-${ringIndex}`);
                if (rotationInput) rotationInput.value = angle;
                if (rotationSlider) rotationSlider.value = angle;
            }

            // Event handlers / 事件处理器
            function handleMouseDown(e) {
                if (e.button !== 0) return;
                e.preventDefault();

                const distance = getDistanceFromCenter(e.clientX, e.clientY);
                const ringIndex = getRingIndexFromRadius(distance);

                if (ringIndex >= 0) {
                    state.isDragging = true;
                    state.dragRingIndex = ringIndex;
                    state.startAngle = getAngleFromCenter(e.clientX, e.clientY);
                    state.startRotation = config.rings[state.dragRingIndex].rotation || 0;
                    svg.style.cursor = 'grabbing';
                    document.body.style.userSelect = 'none';
                    hideHoverFeedback();
                }
            }

            function handleMouseMove(e) {
                if (!state.isDragging || state.dragRingIndex < 0) {
                    const distance = getDistanceFromCenter(e.clientX, e.clientY);
                    const ringIndex = getRingIndexFromRadius(distance);
                    svg.style.cursor = ringIndex >= 0 ? 'grab' : 'default';
                    updateHoverFeedback(ringIndex, e.clientX, e.clientY);
                    return;
                }

                e.preventDefault(); // Only block default once a drag is confirmed / 仅在确认拖拽后才阻止默认行为

                const currentAngle = getAngleFromCenter(e.clientX, e.clientY);
                let angleDelta = currentAngle - state.startAngle;
                
                if (angleDelta > 180) angleDelta -= 360;
                else if (angleDelta < -180) angleDelta += 360;
                
                const newRotation = SVGUtils.normalizeAngle(state.startRotation + angleDelta);
                config.rings[state.dragRingIndex].rotation = newRotation;
                
                updateRotationInputs(state.dragRingIndex, Math.round(newRotation));

                // Cheap transform-only update while dragging (no whole-SVG rebuild) / 拖拽时仅更新变换（不重建整个SVG）
                const cx = config.centerX;
                const cy = config.centerY;
                // Only the angular geometry gets a rigid rotation / 仅角度几何图形做刚性旋转
                [`segmentRing${state.dragRingIndex}`, `radialLines${state.dragRingIndex}`].forEach(id => {
                    const group = svg.querySelector(`#${id}`);
                    if (group) group.setAttribute('transform', `rotate(${angleDelta} ${cx} ${cy})`);
                });

                // Labels contain upright text, so re-position them instead of rotating the group / 标签含正立文字，需重新定位而非旋转整组
                const dragIndex = state.dragRingIndex;
                if (!labelRefreshFrame) {
                    labelRefreshFrame = requestAnimationFrame(() => {
                        labelRefreshFrame = null;
                        RingRenderer.refreshRingLabels(
                            svg,
                            config.rings[dragIndex],
                            dragIndex,
                            config,
                            currentLanguage
                        );
                    });
                }
            }

            function handleMouseUp(e) {
                if (state.isDragging && state.dragRingIndex >= 0) {
                    e.preventDefault();
                    
                    const finalAngle = Math.round(config.rings[state.dragRingIndex].rotation);
                    config.rings[state.dragRingIndex].rotation = finalAngle;
                    
                    updateRotationInputs(state.dragRingIndex, finalAngle);
                    flushRegenerate();
                    
                    state.isDragging = false;
                    state.dragRingIndex = -1;
                    svg.style.cursor = 'default';
                    document.body.style.userSelect = '';
                }
                hideHoverFeedback();
            }

            function handleMouseLeave(e) {
                if (state.isDragging && state.dragRingIndex >= 0) {
                    const finalAngle = Math.round(config.rings[state.dragRingIndex].rotation);
                    config.rings[state.dragRingIndex].rotation = finalAngle;
                    
                    updateRotationInputs(state.dragRingIndex, finalAngle);
                    flushRegenerate();
                    
                    state.isDragging = false;
                    state.dragRingIndex = -1;
                    svg.style.cursor = 'default';
                    document.body.style.userSelect = '';
                }
                hideHoverFeedback();
            }

            // Bind event listeners / 绑定事件监听器
            svg.addEventListener('mousedown', handleMouseDown);
            svg.addEventListener('mousemove', handleMouseMove);
            svg.addEventListener('mouseup', handleMouseUp);
            svg.addEventListener('mouseleave', handleMouseLeave);
            
            // Touch events for mobile / 移动端触摸事件
            svg.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    e.preventDefault(); // Prevent scrolling and other touch behaviors / 防止滚动和其他触摸行为
                    const touch = e.touches[0];
                    handleMouseDown({
                        button: 0, clientX: touch.clientX, clientY: touch.clientY,
                        preventDefault: () => e.preventDefault()
                    });
                }
            }, { passive: false }); // Allow preventDefault / 允许preventDefault

            svg.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1 && state.isDragging) {
                    e.preventDefault(); // Prevent scrolling during drag / 拖拽期间防止滚动
                    const touch = e.touches[0];
                    handleMouseMove({
                        clientX: touch.clientX, clientY: touch.clientY,
                        preventDefault: () => e.preventDefault()
                    });
                }
            }, { passive: false }); // Allow preventDefault / 允许preventDefault

            svg.addEventListener('touchend', function(e) {
                e.preventDefault(); // Prevent default touch end behaviors / 防止默认触摸结束行为
                handleMouseUp({ preventDefault: () => e.preventDefault() });
            }, { passive: false }); // Allow preventDefault / 允许preventDefault
        }

        // Download SVG function / 下载SVG功能
        function downloadSVG() {
            const svg = document.querySelector('#svg-container svg');
            if (!svg) return;

            const svgData = new XMLSerializer().serializeToString(svg);
            const blob = new Blob([svgData], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = 'multi-ring-circle.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Copy SVG to clipboard / 复制SVG到剪贴板
        async function copySVG() {
            const svg = document.querySelector('#svg-container svg');
            if (!svg) return;

            const svgData = new XMLSerializer().serializeToString(svg);

            const t = i18n[currentLanguage];
            try {
                await navigator.clipboard.writeText(svgData);
                alert(t.copySuccess);
            } catch (err) {
                // Fallback for browsers that don't support clipboard API / 不支持剪贴板 API 的浏览器回退方案
                const textArea = document.createElement('textarea');
                textArea.value = svgData;
                document.body.appendChild(textArea);
                textArea.select();
                let successful = false;
                try {
                    successful = document.execCommand('copy');
                } catch (e) {
                    // execCommand may throw; treat as failure / execCommand 可能抛错，按失败处理
                    successful = false;
                }
                document.body.removeChild(textArea);
                alert(successful ? t.copySuccess : t.copyError);
            }
        }

        /**
         * Validate and update ring count / 验证并更新圈数
         */
        function validateAndUpdateRings() {
            const input = document.getElementById('ringCount');
            const errorDiv = document.getElementById('ringCountError');
            const value = input.value;

            // Clear previous error messages / 清除之前的错误信息
            errorDiv.textContent = '';

            // Validate input / 验证输入
            if (value === '' || isNaN(value) || !Number.isInteger(parseFloat(value))) {
                errorDiv.textContent = i18n[currentLanguage].invalidInteger;
                return;
            }

            const ringCount = parseInt(value);
            if (ringCount < 1 || ringCount > 99) {
                errorDiv.textContent = i18n[currentLanguage].ringCountRange;
                return;
            }

            // Update configuration / 更新配置
            updateRingConfiguration(ringCount);
            generateRingParams();
            generateCircle();
        }

        /**
         * Update ring configuration / 更新圈层配置
         * @param {number} ringCount - New ring count / 新的圈数
         */
        function updateRingConfiguration(ringCount) {
            const currentRings = config.rings.length;
            const baseRadius = config.centerRadius;
            const ringWidth = 40;

            // Dynamically get all available segment types from SegmentData module / 从SegmentData模块动态获取所有可用的分段类型
            const availableTypes = SegmentData.getAvailableTypes();
            
            // Define preferred order, ensuring 'manual' is first / 定义优先顺序，确保'manual'在第一位
            const preferredOrder = ['manual', 'tiangan', 'dizhi', 'solarTerms', 'xiantianBagua', 'houtianBagua', 'meridian', 'major', 'minor', 'zodiac', 'animal'];
            
            // Create ordered list: preferred types first, then remaining types / 创建有序列表：优先类型在前，剩余类型在后
            const segmentTypeOrder = [];
            
            // Add types in preferred order if they exist / 按优先顺序添加存在的类型
            preferredOrder.forEach(type => {
                if (availableTypes.includes(type)) {
                    segmentTypeOrder.push(type);
                }
            });
            
            // Add any remaining types not in preferred order / 添加不在优先顺序中的剩余类型
            availableTypes.forEach(type => {
                if (!segmentTypeOrder.includes(type)) {
                    segmentTypeOrder.push(type);
                }
            });

            if (ringCount <= currentRings) {
                // If new count <= current, keep existing config / 如果新圈数小于等于当前圈数，保留现有配置
                config.rings = config.rings.slice(0, ringCount);
            } else {
                // If new count > current, add new rings / 如果新圈数大于当前圈数，添加新圈层
                for (let i = currentRings; i < ringCount; i++) {
                    const innerRadius = baseRadius + i * ringWidth;
                    const outerRadius = baseRadius + (i + 1) * ringWidth;

                    // Determine segment type: use ordered list or fallback to 'manual' / 确定分段类型：使用有序列表或回退到'manual'
                    const segmentType = i < segmentTypeOrder.length ? segmentTypeOrder[i] : 'manual';
                    
                    // Get default data for this segment type / 获取此分段类型的默认数据
                    const segmentData = SegmentData.getData(segmentType, currentLanguage);
                    const defaultLabels = segmentData ? segmentData.labels : ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
                    const defaultRotation = segmentData ? segmentData.defaultRotation : 0;

                    config.rings.push({
                        innerRadius: innerRadius,
                        outerRadius: outerRadius,
                        color: getRandomColor(),
                        type: 'solid',
                        rotation: defaultRotation,
                        segmentType: segmentType,
                        segmentLabels: defaultLabels,
                        segmentName: segmentType === 'manual' ? (currentLanguage === 'zh' ? '自定义' : 'Custom') : undefined
                    });
                }
            }
        }

                // 手工输入选项（仅在分段类型为manual时显示）
                const manualInputSection = ring.segmentType === 'manual' ? `

                // Color picker (only displayed in solid color type) / 颜色选择器（仅在纯色类型时显示）
                const colorPicker = ring.type === 'solid' ? `
                    <label>${getText('color')}:</label>
                    <input type="color" value="${safeColor}" title="${getText('color')}" onchange="updateRingColor(${index}, this.value)">
                ` : '';

                // Assemble complete HTML (in new order: segment type → color type → rotation angle) / 组装完整的HTML（按新顺序：分段类型→颜色类型→旋转角度）
                ringDiv.innerHTML = `
                    <div class="ring-index">${index + 1}</div>

                                <option value="solid" ${ring.type === 'solid' ? 'selected' : ''}>${getText('solid')}</option>

                        <div class="param-row">
                            <label>${getText('rotation')}:</label>
                            <div class="rotation-control">
                                <input type="range" class="rotation-slider ${ring.type === 'solid' ? 'solid-color' : ''}" 
                                       id="slider-${index}" min="0" max="360" value="${safeRotation}" 
                                       style="${ring.type === 'solid' ? `--slider-color: ${safeColor}` : ''}"
                                       oninput="updateRingRotation(${index}, this.value); document.getElementById('rotation-${index}').value = this.value"
                                       onchange="applyRingRotation(${index}, this.value)">
                                <input type="number" id="rotation-${index}" class="rotation-input" min="0" max="360"

                            </div>

                    </div>
                `;
                container.appendChild(ringDiv);
            });
        }

        /**
         * Update center name / 更新中心名称
         * @param {string} name - Center text / 中心文字
         * @param {boolean} debounced - Debounce the redraw for keystrokes / 按键输入时对重绘防抖
         */
        function updateCenterName(name, debounced = false) {
            config.centerNames[currentLanguage] = name;
            if (debounced) {
                debouncedRegenerate();
            } else {
                generateCircle();
            }
        }

        // Update ring color / 更新圈层颜色
        function updateRingColor(index, color) {
            config.rings[index].color = color;
            const slider = document.getElementById(`slider-${index}`);
            if (slider && config.rings[index].type === 'solid') {
                slider.style.setProperty('--slider-color', color);
            }
            generateCircle();
        }

        // Cheap rotation preview while dragging the slider (transform only, no full rebuild) / 拖拽滑块时仅做廉价旋转预览（只更新变换，不整图重建）
        function updateRingRotation(index, rotation) {
            const parsed = parseFloat(rotation) || 0;
            config.rings[index].rotation = parsed;

            const ring = config.rings[index];
            // Mirror renderRing's effective angle (0 falls back to the segment default) / 与renderRing的有效角度一致（0回退为分段默认角度）
            const segmentConfig = RingRenderer.getRingSegmentConfig(ring, currentLanguage);
            const defaultRotation = (segmentConfig && segmentConfig.defaultRotation) || 0;
            const effective = parsed || defaultRotation || 0;
            const rendered = typeof renderedRotations[index] === 'number' ? renderedRotations[index] : effective;
            const delta = effective - rendered;

            const svg = document.querySelector('#svg-container svg');
            if (!svg) return;

            // Only the angular geometry gets a rigid rotation / 仅角度几何图形做刚性旋转
            const cx = config.centerX;
            const cy = config.centerY;
            [`segmentRing${index}`, `radialLines${index}`].forEach(id => {
                const group = svg.querySelector(`#${id}`);
                if (group) group.setAttribute('transform', `rotate(${delta} ${cx} ${cy})`);
            });

            // Labels contain upright text, so re-position them instead of rotating the group / 标签含正立文字，需重新定位而非旋转整组
            RingRenderer.refreshRingLabels(svg, ring, index, config, currentLanguage);
        }

        // Apply ring rotation immediately and flush any pending debounce / 立即应用圈层旋转并刷新待处理防抖
        function applyRingRotation(index, rotation) {
            if (rotation !== undefined) {
                config.rings[index].rotation = parseFloat(rotation) || 0;
            }
            flushRegenerate();
        }

        // Update ring type / 更新圈层类型
        function updateRingType(index, type) {
            const currentRotation = config.rings[index].rotation || 0;
            const currentSegmentType = config.rings[index].segmentType || 'manual';
            const currentSegmentLabels = config.rings[index].segmentLabels;
            const currentSegmentName = config.rings[index].segmentName;

            config.rings[index].type = type;
            config.rings[index].rotation = currentRotation;
            config.rings[index].segmentType = currentSegmentType;
            if (currentSegmentLabels) config.rings[index].segmentLabels = currentSegmentLabels;
            if (currentSegmentName) config.rings[index].segmentName = currentSegmentName;

            if (type === 'solid') {
                if (!config.rings[index].color || typeof config.rings[index].color !== 'string' || !config.rings[index].color.startsWith('#')) {
                    config.rings[index].color = getRandomColor();
                }
            }

            generateRingParams();
            generateCircle();
        }

        // Update segment type / 更新分段类型
        // silent=true updates data only and skips the redraw so callers can batch it / silent=true 仅更新数据并跳过重绘，便于调用方批量处理
        function updateSegmentType(index, segmentType, silent = false) {
            // Keep all other properties unchanged, only update segment type related properties / 保持所有其他属性不变，只更新分段类型相关属性
            const currentRotation = config.rings[index].rotation || 0;
            const currentType = config.rings[index].type; // Keep color type unchanged / 保持颜色类型不变
            const currentColor = config.rings[index].color; // Keep color unchanged / 保持颜色不变

            config.rings[index].segmentType = segmentType;
            config.rings[index].rotation = currentRotation;
            config.rings[index].type = currentType; // Ensure color type is not changed / 确保颜色类型不被改变
            config.rings[index].color = currentColor; // Ensure color is not changed / 确保颜色不被改变

            // Get default labels from SegmentData module / 从SegmentData模块获取默认标签
            const segmentData = SegmentData.getData(segmentType, currentLanguage);
            if (segmentData && segmentData.labels) {
                config.rings[index].segmentLabels = segmentData.labels;
                if (segmentType === 'manual') {
                    config.rings[index].segmentName = config.rings[index].segmentName || (currentLanguage === 'zh' ? '自定义' : 'Custom');
                }
            }

            // Regenerate interface and circle (does not change color type) / 重新生成界面和圆形（不会改变颜色类型）
            if (!silent) {
                generateRingParams();
                generateCircle();
            }
        }

        // Update segment name / 更新分段名称
        function updateSegmentName(index, name) {
            config.rings[index].segmentName = name;
            config.rings[index].content = name;
            generateCircle();
        }

        // 更新分段标签 / Update segment labels
        function updateSegmentLabels(index, labelsString) {
            // 处理转义字符：\, 转为真正的逗号
            const processedString = labelsString.replace(/\\,/g, ''); // 使用临时占位符
            const labels = processedString.split(',').map(s => {
                return s.replace(//g, ',').trim(); // 恢复转义的逗号
            }).filter(s => s !== '');
            
            if (labels.length > 0) {
                config.rings[index].segmentLabels = labels;
                generateCircle();
            }
        }

        // Switch language / 切换语言
        function switchLanguage(lang) {
            // Use new internationalization manager / 使用新的国际化管理器
            I18nAPI.switchLanguage(lang);
            // Keep <html lang> in sync with the active language / 保持 <html lang> 与当前语言同步
            document.documentElement.lang = I18nAPI.getCurrentLanguage() === 'zh' ? 'zh-CN' : 'en';
            
            // Update center name input to current language content / 更新中心名称输入框内容为当前语言的内容
            const centerNameInput = document.getElementById('centerName');
            centerNameInput.value = config.centerNames[currentLanguage] || '';

            // Reset all ring segment labels to adapt to new language / 重新设置所有圈层的分段标签以适应新语言
            config.rings.forEach((ring, index) => {
                if (ring.segmentType && ring.segmentType !== 'manual') {
                    // Data-only update; the single rebuild below covers every ring / 仅更新数据；下方统一重绘覆盖所有圈层
                    updateSegmentType(index, ring.segmentType, true);
                }
            });

            updateUILanguage();
            generateRingParams();
            generateCircle(); // Regenerate circle to display center text in new language / 重新生成圆形以显示新语言的中心文字
