        // =================================================================
        // 📁 CONFIGURATION MANAGER MODULE / 配置管理模块
        // =================================================================
        const ConfigurationManager = {
            // Module metadata / 模块元数据
            metadata: {
                version: '1.0.0',
                supportedFormats: ['json'],
                fileExtension: '.json',
                mimeType: 'application/json'
            },
            
            // Module dependencies / 模块依赖
            dependencies: {
                i18n: null, // Will be injected / 将被注入
                config: null, // Will be injected / 将被注入
                validation: null // Will be injected / 将被注入
            },
            
            /**
             * Initialize the configuration manager / 初始化配置管理器
             * @param {Object} deps - Dependencies object / 依赖对象
             */
            init(deps = {}) {
                this.dependencies.i18n = deps.i18n || i18n;
                this.dependencies.config = deps.config || config;
                this.dependencies.validation = deps.validation || this.createDefaultValidation();
                return this;
            },
            
            /**
             * Create default validation functions / 创建默认验证函数
             * @returns {Object} Validation functions / 验证函数对象
             */
            createDefaultValidation() {
                return {
                    isValidConfiguration: (config) => {
                        return config && 
                               typeof config === 'object' && 
                               config.version && 
                               config.rings && 
                               Array.isArray(config.rings);
                    },
                    isValidRingCount: (count) => {
                        return Number.isInteger(count) && count >= 1 && count <= 99;
                    },
                    isValidLanguage: (language) => {
                        return I18nData.isLanguageSupported(language);
                    },
                    isValidTheme: (theme) => {
                        return ThemeManager.isThemeSupported(theme);
                    }
                };
            },
            
            /**
             * Export configuration manager interface / 导出配置管理器接口
             * @returns {Object} Public API / 公共API
             */
            getAPI() {
                return {
                    save: this.saveConfiguration.bind(this),
                    load: this.loadConfiguration.bind(this),
                    export: this.exportConfiguration.bind(this),
                    import: this.importConfiguration.bind(this),
                    validate: this.validateConfiguration.bind(this),
                    getSchema: this.getConfigurationSchema.bind(this),
                    reset: this.resetConfiguration.bind(this)
                };
            },
            
            /**
             * Save current configuration to JSON file / 保存当前配置到JSON文件
             * @param {Object} options - Save options / 保存选项
             * @returns {Promise} Save operation result / 保存操作结果
             */
            async saveConfiguration(options = {}) {
                const { filename, prompt = true } = options;
                const t = this.dependencies.i18n[currentLanguage];
                
                try {
                    // Build configuration object / 构建配置对象
                    const configuration = this.buildConfigurationObject();
                    
                    // Validate configuration before saving / 保存前验证配置
                    const validation = this.validateConfiguration(configuration);
                    if (!validation.isValid) {
                        throw new Error(`Configuration validation failed: ${validation.errors.join(', ')}`);
                    }
                    
                    // Handle filename / 处理文件名
                    let finalFilename = filename;
                    if (!finalFilename && prompt) {
                        finalFilename = await this.promptForFilename();
                        if (!finalFilename) return { cancelled: true }; // User cancelled / 用户取消
                    }
                    
                    if (!finalFilename) {
                        finalFilename = this.generateDefaultFilename();
                    }
                    
                    // Execute save / 执行保存
                    await this.executeFileSave(configuration, finalFilename);
                    
                    return {
                        success: true,
                        filename: `${finalFilename}${this.metadata.fileExtension}`,
                        configuration
                    };
                    
                } catch (error) {
                    return this.handleError('save', error);
                }
            },
            
            /**
             * Load configuration from file / 从文件载入配置
             * @param {Event|File} source - File input event or File object / 文件输入事件或File对象
             * @returns {Promise} Load operation result / 载入操作结果
             */
            async loadConfiguration(source) {
                try {
                    const file = source instanceof File ? source : source.target.files[0];
                    if (!file) return { cancelled: true };
                    
                    const configData = await this.readFileContent(file);
                    const configuration = this.parseConfiguration(configData);
                    
                    // Validate configuration / 验证配置
                    const validation = this.validateConfiguration(configuration);
                    if (!validation.isValid) {
                        throw new Error(`Invalid configuration: ${validation.errors.join(', ')}`);
                    }
                    
                    // Apply configuration / 应用配置
                    await this.applyConfiguration(configuration);
                    
                    // Clear file input if it was an event / 如果是事件则清空文件输入
                    if (source.target) {
                        source.target.value = '';
                    }
                    
                    return {
                        success: true,
                        configuration,
                        validation
                    };
                    
                } catch (error) {
                    return this.handleError('load', error);
                }
            },
            
            /**
             * Export configuration as JSON string / 导出配置为JSON字符串
             * @param {Object} options - Export options / 导出选项
             * @returns {Object} Export result / 导出结果
             */
            exportConfiguration(options = {}) {
                const { pretty = true, validate = true } = options;
                
                try {
                    const configuration = this.buildConfigurationObject();
                    
                    if (validate) {
                        const validation = this.validateConfiguration(configuration);
                        if (!validation.isValid) {
                            throw new Error(`Configuration validation failed: ${validation.errors.join(', ')}`);
                        }
                    }
                    
                    const jsonString = pretty ? 
                        JSON.stringify(configuration, null, 2) : 
                        JSON.stringify(configuration);
                        
                    return {
                        success: true,
                        data: jsonString,
                        configuration
                    };
                    
                } catch (error) {
                    return this.handleError('export', error);
                }
            },
            
            /**
             * Import configuration from JSON string / 从JSON字符串导入配置
             * @param {string} jsonString - JSON configuration string / JSON配置字符串
             * @returns {Promise} Import result / 导入结果
             */
            async importConfiguration(jsonString) {
                try {
                    const configuration = this.parseConfiguration(jsonString);
                    
                    // Validate configuration / 验证配置
                    const validation = this.validateConfiguration(configuration);
                    if (!validation.isValid) {
                        throw new Error(`Invalid configuration: ${validation.errors.join(', ')}`);
                    }
                    
                    // Apply configuration / 应用配置
                    await this.applyConfiguration(configuration);
                    
                    return {
                        success: true,
                        configuration,
                        validation
                    };
                    
                } catch (error) {
                    return this.handleError('import', error);
                }
            },
            
            /**
             * Validate configuration object / 验证配置对象
             * @param {Object} configuration - Configuration to validate / 要验证的配置
             * @returns {Object} Validation result / 验证结果
             */
            validateConfiguration(configuration) {
                const errors = [];
                const warnings = [];
                
                // Null / non-object guard before any dereference / 解引用前先做空值或非对象守卫
                if (!configuration || typeof configuration !== 'object') {
                    errors.push('Invalid configuration structure');
                    return {
                        isValid: false,
                        errors,
                        warnings,
                        hasWarnings: false
                    };
                }
                
                // Basic structure validation / 基本结构验证
                if (!this.dependencies.validation.isValidConfiguration(configuration)) {
                    errors.push('Invalid configuration structure');
                }
                
                // Version validation / 版本验证
                if (configuration.version && configuration.version !== this.metadata.version) {
                    warnings.push(`Configuration version mismatch: expected ${this.metadata.version}, got ${configuration.version}`);
                }
                
                // Ring count validation / 圈数验证
                if (configuration.ringCount && !this.dependencies.validation.isValidRingCount(configuration.ringCount)) {
                    errors.push('Invalid ring count: must be between 1 and 99');
                }
                
                // Language validation / 语言验证
                if (configuration.language && !this.dependencies.validation.isValidLanguage(configuration.language)) {
                    warnings.push(`Unsupported language: ${configuration.language}`);
                }
                
                // Theme validation / 主题验证
                if (configuration.theme && !this.dependencies.validation.isValidTheme(configuration.theme)) {
                    warnings.push(`Unsupported theme: ${configuration.theme}`);
                }
                
                // Rings validation / 圈层验证
                if (Array.isArray(configuration.rings)) {
                    configuration.rings.forEach((ring, index) => {
                        if (!ring.segmentType) {
                            warnings.push(`Ring ${index + 1}: missing segmentType`);
                        }
                        if (!ring.type || !['solid', 'segments'].includes(ring.type)) {
                            warnings.push(`Ring ${index + 1}: invalid or missing type`);
                        }
                    });
                } else if (configuration.rings) {
                    warnings.push('Invalid rings structure: expected an array');
                }
                
                return {
                    isValid: errors.length === 0,
                    errors,
                    warnings,
                    hasWarnings: warnings.length > 0
                };
            },
            
            /**
             * Get configuration schema / 获取配置模式
             * @returns {Object} Configuration schema / 配置模式
             */
            getConfigurationSchema() {
                return {
                    type: 'object',
                    required: ['version', 'rings'],
                    properties: {
                        version: { type: 'string' },
                        timestamp: { type: 'string' },
                        language: { type: 'string', enum: I18nData.supportedLanguages },
                        theme: { type: 'string', enum: ThemeManager.supportedThemes },
                        centerNames: {
                            type: 'object',
                            properties: {
                                zh: { type: 'string' },
                                en: { type: 'string' }
                            }
                        },
                        showLegend: { type: 'boolean' },
                        legendPosition: { type: 'string', enum: ['right', 'bottomRight'] },
                        ringCount: { type: 'integer', minimum: 1, maximum: 99 },
                        rings: {
                            type: 'array',
                            items: {
                                type: 'object',
                                required: ['segmentType', 'type'],
                                properties: {
                                    segmentType: { type: 'string' },
                                    type: { type: 'string', enum: ['solid', 'segments'] },
                                    color: { type: 'string' },
                                    rotation: { type: 'number' },
                                    segmentLabels: { type: 'array', items: { type: 'string' } },
                                    segmentName: { type: 'string' }
                                }
                            }
                        }
                    }
                };
            },
            
            /**
             * Reset configuration to defaults / 重置配置为默认值
             * @returns {Promise} Reset result / 重置结果
             */
            async resetConfiguration() {
                try {
                    // Reset language via I18n API to keep I18n state in sync / 通过I18n API重置语言以同步I18n状态
                    I18nAPI.switchLanguage('en');
                    
                    // Reset theme without overwriting the user's persisted preference / 重置主题但不覆盖用户已保存的偏好
                    ThemeManager.switchTheme('light', false);
                    
                    // Reset center names to defaults / 重置中心名称为默认值
                    config.centerNames = { zh: '五度圈', en: 'OpenC5' };
                    
                    // Reset UI elements / 重置UI元素
                    document.getElementById('language').value = 'en';
                    document.getElementById('theme').value = 'light';
                    document.getElementById('centerName').value = config.centerNames[currentLanguage] || '';
                    document.getElementById('showLegend').checked = true;
                    document.getElementById('legendPosition').value = 'bottomRight';
                    document.getElementById('ringCount').value = '8';
                    
                    // Reset configuration object / 重置配置对象
                    config.showLegend = true;
                    config.legendPosition = 'bottomRight';
                    
                    // Reinitialize rings / 重新初始化圈层
                    initializeDefaultRings();
                    
                    // Update UI / 更新UI
                    updateUILanguage();
                    generateRingParams();
                    generateCircle();
                    
                    return { success: true };
                    
                } catch (error) {
                    return this.handleError('reset', error);
                }
            },
            
            // ===== PRIVATE HELPER METHODS / 私有辅助方法 =====
            
            /**
             * Build configuration object from current state / 从当前状态构建配置对象
             * @returns {Object} Configuration object / 配置对象
             */
            buildConfigurationObject() {
                const showLegendEl = document.getElementById('showLegend');
                return {
                    version: this.metadata.version,
                    timestamp: new Date().toISOString(),
                    language: currentLanguage,
                    centerNames: this.dependencies.config.centerNames,
                    theme: document.getElementById('theme')?.value || 'light',
                    showLegend: showLegendEl ? showLegendEl.checked : true,
                    legendPosition: document.getElementById('legendPosition')?.value || 'bottomRight',
                    ringCount: parseInt(document.getElementById('ringCount')?.value) || this.dependencies.config.rings.length,
                    rings: this.dependencies.config.rings.map(ring => ({
                        segmentType: ring.segmentType,
                        type: ring.type,
                        color: ring.color,
                        rotation: ring.rotation,
                        segmentLabels: ring.segmentLabels || [],
                        segmentName: ring.segmentName
                    }))
                };
            },
            
            /**
             * Generate default filename / 生成默认文件名
             * @returns {string} Default filename without extension / 不含扩展名的默认文件名
             */
            generateDefaultFilename() {
                const now = new Date();
                const dateTime = now.toISOString().replace(/[:.]/g, '-').slice(0, -5);
                return `circle-generator-config-${dateTime}`;
            },
            
            /**
             * Prompt user for filename / 提示用户输入文件名
             * @returns {Promise<string|null>} Filename or null if cancelled / 文件名或null（如果取消）
             */
            async promptForFilename() {
                const defaultFilename = this.generateDefaultFilename();
                const promptText = currentLanguage === 'zh' ? 
                    '请输入配置文件名（不含扩展名）：' : 
                    'Please enter configuration filename (without extension):';
                
                let filename = prompt(promptText, defaultFilename);
                
                if (filename === null) return null; // User cancelled / 用户取消
                
                if (!filename || filename.trim() === '') {
                    filename = defaultFilename;
                } else {
                    filename = filename.trim();
                    // Remove extension if user added it / 移除扩展名（如果用户添加了）
                    if (filename.toLowerCase().endsWith(this.metadata.fileExtension)) {
                        filename = filename.slice(0, -this.metadata.fileExtension.length);
                    }
                }
                
                return filename;
            },
            
            /**
             * Sanitize a user-supplied filename / 净化用户提供的文件名
             * @param {string} filename - Raw filename without extension / 不含扩展名的原始文件名
             * @returns {string} Safe filename / 安全的文件名
             */
            sanitizeFilename(filename) {
                let safe = String(filename == null ? '' : filename)
                    .replace(/[\\/:*?"<>|]/g, '_') // Strip illegal characters / 移除非法字符
                    .replace(/\.\./g, '_') // Neutralize path traversal / 消除路径穿越
                    .replace(/^[.\s]+/, '')
                    .trim();
                if (!safe) {
                    safe = this.generateDefaultFilename(); // Sensible fallback / 合理的兜底名称
                }
                return safe;
            },
            
            /**
             * Execute file save operation / 执行文件保存操作
             * @param {Object} configuration - Configuration to save / 要保存的配置
             * @param {string} filename - Filename without extension / 不含扩展名的文件名
             * @returns {Promise} Save operation promise / 保存操作Promise
             */
            async executeFileSave(configuration, filename) {
                return new Promise((resolve, reject) => {
                    try {
                        const jsonString = JSON.stringify(configuration, null, 2);
                        const blob = new Blob([jsonString], { type: this.metadata.mimeType });
                        const url = URL.createObjectURL(blob);
                        
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `${this.sanitizeFilename(filename)}${this.metadata.fileExtension}`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        
                        resolve();
                    } catch (error) {
                        reject(error);
                    }
                });
            },
            
            /**
             * Read file content / 读取文件内容
             * @param {File} file - File to read / 要读取的文件
             * @returns {Promise<string>} File content / 文件内容
             */
            readFileContent(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = (e) => reject(new Error('Failed to read file'));
                    reader.readAsText(file);
                });
            },
            
            /**
             * Parse configuration from string / 从字符串解析配置
             * @param {string} configString - Configuration string / 配置字符串
             * @returns {Object} Parsed configuration / 解析的配置
             */
            parseConfiguration(configString) {
                try {
                    return JSON.parse(configString);
                } catch (error) {
                    throw new Error('Invalid JSON format');
                }
            },
            
            /**
             * Apply configuration to current state / 将配置应用到当前状态
             * @param {Object} configuration - Configuration to apply / 要应用的配置
             * @returns {Promise} Application result / 应用结果
             */
            async applyConfiguration(configuration) {
                // Apply language settings / 应用语言设置
                if (configuration.language && I18nData.isLanguageSupported(configuration.language)) {
                    // Route through the i18n switch so observers sync currentLanguage, state and <html lang> / 通过i18n切换入口，让观察者同步currentLanguage、状态与<html lang>
                    I18nAPI.switchLanguage(configuration.language);
                    const languageSelect = document.getElementById('language');
                    if (languageSelect) languageSelect.value = configuration.language;
                    updateUILanguage();
                }
                
                // Apply center names / 应用中心名称
                if (configuration.centerNames) {
                    const centerName = configuration.centerNames[currentLanguage] || 
                                     configuration.centerNames.en || 
                                     configuration.centerNames.zh || '';
                    document.getElementById('centerName').value = centerName;
                    this.dependencies.config.centerNames[currentLanguage] = centerName;
                }
                
                // Apply theme settings / 应用主题设置
                if (configuration.theme && ThemeManager.isThemeSupported(configuration.theme)) {
                    const themeSelect = document.getElementById('theme');
                    if (themeSelect) {
                        themeSelect.value = configuration.theme;
                        ThemeManager.switchTheme(configuration.theme);
                    }
                }
                
                // Apply legend settings / 应用图例设置
                if (typeof configuration.showLegend === 'boolean') {
                    document.getElementById('showLegend').checked = configuration.showLegend;
                    this.dependencies.config.showLegend = configuration.showLegend;
                    updateLegendVisibility(configuration.showLegend);
                }
                
                if (configuration.legendPosition) {
                    document.getElementById('legendPosition').value = configuration.legendPosition;
                    this.dependencies.config.legendPosition = configuration.legendPosition;
                    updateLegendPosition(configuration.legendPosition);
                }
                
                // Apply ring configuration / 应用圈层配置
                if (configuration.ringCount && configuration.ringCount > 0 && configuration.ringCount <= 99) {
                    document.getElementById('ringCount').value = configuration.ringCount;
                    await this.applyRingConfiguration(configuration);
                }

                // Notify success once the whole configuration has been applied / 整份配置应用完成后提示成功
                showToast(I18nAPI.getText('loadConfigSuccess', currentLanguage));
            },
            
            /**
             * Apply ring configuration / 应用圈层配置
             * @param {Object} configuration - Configuration object / 配置对象
             * @returns {Promise} Application result / 应用结果
             */
            async applyRingConfiguration(configuration) {
                this.dependencies.config.rings = [];
                const baseRadius = this.dependencies.config.centerRadius;
                const ringWidth = 40;
                
                for (let i = 0; i < configuration.ringCount; i++) {
                    const ringConfig = configuration.rings[i] || {};
                    const innerRadius = baseRadius + i * ringWidth;
                    const outerRadius = baseRadius + (i + 1) * ringWidth;
                    
                    this.dependencies.config.rings.push({
                        segmentType: ringConfig.segmentType || 'manual',
                        type: ringConfig.type || 'segments',
                        color: ringConfig.color || getRandomColor(),
                        rotation: ringConfig.rotation || 0,
                        // Treat an empty imported array as "no override" so SegmentData defaults survive / 将空数组视为“无覆盖”，使SegmentData默认标签得以保留
                        segmentLabels: (Array.isArray(ringConfig.segmentLabels) && ringConfig.segmentLabels.length > 0) ? ringConfig.segmentLabels : undefined,
                        segmentName: ringConfig.segmentName,
                        innerRadius: innerRadius,
                        outerRadius: outerRadius
                    });
                }
                
                validateAndUpdateRings();
                generateRingParams();
                generateCircle();
            },
            
            /**
             * Handle errors / 处理错误
             * @param {string} operation - Operation that failed / 失败的操作
             * @param {Error} error - Error object / 错误对象
             * @returns {Object} Error result / 错误结果
             */
            handleError(operation, error) {
                const errorMessage = currentLanguage === 'zh' ? 
                    `${operation === 'save' ? '保存' : operation === 'load' ? '载入' : operation === 'export' ? '导出' : operation === 'import' ? '导入' : '重置'}配置失败: ${error.message}` :
                    `Failed to ${operation} configuration: ${error.message}`;
                
                console.error(`Configuration ${operation} error:`, error);
                alert(errorMessage);
                
                return {
                    success: false,
                    error: errorMessage,
                    details: error
                };
            }
        };

        // Initialize configuration manager / 初始化配置管理器
        const ConfigManager = ConfigurationManager.init();
        const configAPI = ConfigManager.getAPI();

        // Backward compatible interface functions / 向后兼容的接口函数
        function saveConfiguration() {
            return configAPI.save();
        }

        function loadConfiguration(event) {
            return configAPI.load(event);
        }

        /**
         * Update legend visibility / 更新图例显示状态
         * @param {boolean} show - Whether to show legend / 是否显示图例
         */
        function updateLegendVisibility(show) {
            config.showLegend = show;
            generateCircle();
        }

        /**
         * Update legend position / 更新图例位置
         * @param {string} position - Legend position: right/bottomRight / 图例位置：right/bottomRight
         */
        function updateLegendPosition(position) {
            config.legendPosition = position;
            generateCircle();
        }

        // =================================================================
        // 🎨 THEME MANAGER MODULE / 主题管理模块
        // =================================================================
        const ThemeManager = {
            // 支持的主题列表 / Supported themes list
            supportedThemes: ['system', 'light', 'dark'],
            
            // 当前主题 / Current theme
            currentTheme: 'light',
            
            // 主题显示名称 / Theme display names
            themeNames: {
                system: { zh: '跟随系统', en: 'Follow System' },
                light: { zh: '浅色', en: 'Light' },
                dark: { zh: '暗色', en: 'Dark' }
            },
            
            /**
             * 切换主题 / Switch theme
             * @param {string} theme - Theme name: system/light/dark / 主题名称：system/light/dark
             * @param {boolean} persist - Whether to save as user preference / 是否保存为用户偏好
             */
            switchTheme(theme, persist = true) {
                if (!this.supportedThemes.includes(theme)) {
                    theme = 'light'; // Fallback to light theme silently / 静默回退到浅色主题
                }
                
                this.currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                if (persist) {
                    this.saveThemePreference(theme); // Only write when requested / 仅在需要时写入偏好
                }
                
                // 触发主题切换事件 / Trigger theme switch event
                this.onThemeChanged(theme);
            },
            
            /**
             * 初始化主题设置 / Initialize theme settings
             */
            initTheme() {
                const savedTheme = this.loadThemePreference();
                this.currentTheme = savedTheme;
                document.documentElement.setAttribute('data-theme', savedTheme);
                
                // 同步UI选择器 / Sync UI selector
                const themeSelect = document.getElementById('theme');
                if (themeSelect) {
                    themeSelect.value = savedTheme;
                }
            },
            
            /**
             * 获取系统主题偏好 / Get system theme preference
             * @returns {string} 'light' or 'dark'
             */
            getSystemTheme() {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return 'dark';
                }
                return 'light';
            },
            
            /**
             * 保存主题偏好到本地存储 / Save theme preference to localStorage
             * @param {string} theme - Theme name / 主题名称
             */
            saveThemePreference(theme) {
                try {
                    localStorage.setItem('selectedTheme', theme);
                } catch (error) {
                    // Silently handle localStorage errors / 静默处理本地存储错误
                }
            },
            
            /**
             * 从本地存储加载主题偏好 / Load theme preference from localStorage
             * @returns {string} Saved theme or default 'light'
             */
            loadThemePreference() {
                try {
                    const savedTheme = localStorage.getItem('selectedTheme');
                    if (savedTheme && this.supportedThemes.includes(savedTheme)) {
                        return savedTheme;
                    }
                } catch (error) {
                    // Silently handle localStorage errors / 静默处理本地存储错误
                }
                return 'light'; // Default theme / 默认主题
            },
            
            /**
             * 获取主题显示名称 / Get theme display name
             * @param {string} theme - Theme name / 主题名称
             * @param {string} language - Language code / 语言代码
             * @returns {string} Display name / 显示名称
             */
            getThemeName(theme, language = 'en') {
                if (this.themeNames[theme] && this.themeNames[theme][language]) {
                    return this.themeNames[theme][language];
                }
                return theme; // Fallback to theme key / 回退到主题键名
            },
            
            /**
             * 获取所有主题的显示选项 / Get display options for all themes
             * @param {string} language - Language code / 语言代码
             * @returns {Array} Array of {value, label} objects
             */
            getAllThemeOptions(language = 'en') {
                return this.supportedThemes.map(theme => ({
                    value: theme,
                    label: this.getThemeName(theme, language)
                }));
            },
            
            /**
             * 检查主题是否支持 / Check if theme is supported
             * @param {string} theme - Theme name / 主题名称
             * @returns {boolean} Whether theme is supported / 是否支持该主题
             */
            isThemeSupported(theme) {
                return this.supportedThemes.includes(theme);
            },
            
            /**
             * 主题切换回调 / Theme change callback
             * 可以被外部代码覆盖以响应主题切换 / Can be overridden by external code to respond to theme changes
             * @param {string} newTheme - New theme name / 新主题名称
             */
            onThemeChanged(newTheme) {
                // Default implementation: can be overridden externally / 默认实现：可以被外部覆盖
                // Theme change handling can be implemented here if needed / 如果需要可以在这里实现主题切换处理
            },
            
            /**
             * 监听系统主题变化 / Listen for system theme changes
             */
            watchSystemTheme() {
                if (window.matchMedia) {
                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    
                    // 监听系统主题变化 / Listen for system theme changes
                    const handleSystemThemeChange = (e) => {
                        if (this.currentTheme === 'system') {
                            // 如果当前是跟随系统，则重新应用主题 / If currently following system, reapply theme
                            document.documentElement.setAttribute('data-theme', 'system');
                        }
                    };
                    
                    // 添加监听器 / Add listener
                    if (mediaQuery.addListener) {
                        mediaQuery.addListener(handleSystemThemeChange);
                    } else if (mediaQuery.addEventListener) {
                        mediaQuery.addEventListener('change', handleSystemThemeChange);
                    }
                    
                    // 返回清理函数 / Return cleanup function
                    return () => {
                        if (mediaQuery.removeListener) {
                            mediaQuery.removeListener(handleSystemThemeChange);
                        } else if (mediaQuery.removeEventListener) {
                            mediaQuery.removeEventListener('change', handleSystemThemeChange);
                        }
                    };
                }
                
                return () => {}; // No-op cleanup function / 空的清理函数
            }
        };

        // Theme management functions / 主题管理函数
        /**
         * Switch theme / 切换主题
         * @param {string} theme - Theme name: system/light/dark / 主题名称：system/light/dark
         */
        function switchTheme(theme) {
            ThemeManager.switchTheme(theme);
        }
        
        /**
         * Initialize theme settings / 初始化主题设置
         */
        function initTheme() {
            ThemeManager.initTheme();
        }

        // Generate initial circle when page loads / 页面加载时生成初始圆形
        window.addEventListener('load', function () {
            initTheme(); // Initialize theme / 初始化主题
            updateUILanguage(); // Initialize UI language / 初始化界面语言
            initializeDefaultRings(); // Initialize default rings with proper segment types / 初始化默认圈层和正确的分段类型
            // Set center name input value to current language default / 设置中心名称输入框的值为当前语言的默认值
            document.getElementById('centerName').value = config.centerNames[currentLanguage] || '';
            generateRingParams();
            generateCircle();
        });
    </script>
</body>
